name: BerryKitchen
description: BerryKitchen (Berry Kitchen) was an Indonesian online catering and prepared-meal
  company founded in Jakarta in 2012 by Cynthia Tenggara. It took online orders for lunch
  boxes and bento meals aimed at office workers across Jabodetabek, and ran the full chain
  itself - supplier sourcing, cooking, packaging and last-mile delivery - rather than acting
  as a marketplace. It was backed by East Ventures and 500 Startups (now 500 Global) and was
  acquired by Yummy Corp in 2019, with the team folded into Yummy Corp's Yummybox unit and
  the founder subsequently exiting. BerryKitchen never published a public API, developer
  portal or SDKs, and its domain is no longer operated by the company, so this profile is
  catalogued for historical and VC portfolio-graph purposes only.
